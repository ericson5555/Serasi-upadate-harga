<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Login — Serasi Mantap 2026</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef4ff,#f8fafc);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033;padding:20px}.panel{width:min(100%,410px);background:white;border:1px solid #e2e8f0;border-radius:20px;padding:30px;box-shadow:0 18px 50px #0f172a12}h1{margin:0 0 6px;font-size:24px}.sub{margin:0 0 24px;color:#64748b}label{display:block;font-weight:650;margin:14px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}input:focus{outline:3px solid #bfdbfe;border-color:#2563eb}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:#1d4ed8;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.error{min-height:22px;margin:12px 0 0;color:#b91c1c}.foot{font-size:12px;color:#64748b;text-align:center;margin-top:18px}
</style></head>
<body><main class="panel"><h1>Serasi Update Harga</h1><p class="sub">Masuk untuk membuka dashboard harga supplier.</p>
<form id="loginForm"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submitBtn" type="submit">Masuk ke Dashboard</button><p id="error" class="error" role="alert" aria-live="polite"></p></form><p class="foot">Akses khusus pengguna yang diizinkan.</p></main>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('submitBtn'),error=document.getElementById('error');
form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';btn.disabled=true;btn.textContent='Memeriksa...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Login gagal.');location.replace('/');}catch(err){error.textContent=err.message||'Tidak dapat terhubung. Coba lagi.';}finally{btn.disabled=false;btn.textContent='Masuk ke Dashboard';}});
</script></body></html>
